name: tarannum
description: "لعبة ترنم - لعبة بطاقات شعرية عربية مستوحاة من الكاروتا اليابانية."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/verses_combined.json
    - assets/images/logo.png
    - assets/images/bg.jpg
    - assets/images/button_bg.png
    - assets/images/wood_bg.jpg
    - assets/images/parchment_vertical.png
    - assets/images/parchment_horizontal.png
    - assets/audio/bgm.mp3
    - assets/audio/correct.mp3
    - assets/audio/wrong.mp3
    - assets/audio/swipe.mp3

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700